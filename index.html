/* Load georeferenced records for the map.
   ALA serves at most ALA_MAX_RESULTS (5000) per query and no cursor bypasses
   that. So for a query with more georeferenced records than the window, we
   PARTITION space with a quadtree: count each lat/long tile, and recursively
   split any tile over the window until every leaf is small enough to offset-page
   in full. Records on a tile boundary can appear in two tiles, so we dedupe by
   uuid. Tiles only ever match georeferenced records (a lat/long range excludes
   null coordinates), which is exactly what the map needs. */
/* The gate in front of the map's background loader.
   - Only while the Map is on screen (switchView stops the loader when the visitor leaves).
   - Not twice for the same search once it has finished.
   - A search larger than the marker cap (the whole collection, for one) is never loaded
     unasked: the map shows the first page and offers a button (see updateMapInfo). */
function mapLoadNeedsAsking(){return !S.mapUncapped&&!S.mapPoly&&S.total>MAP_POINT_CAP&&S._mapAskedId!==S.mapLoadId}
function startMapLoad(f,loadId){
  if(S.view!=='map'||S.mapPoly||loadId!==S.mapLoadId)return;
  if((f.source||'')==='reg')return; /* QM Register: every point is already in hand */
  const alaT=(S._alaTotal!=null)?S._alaTotal:S.total;
  if(alaT<=INIT_PAGE||S._mapDoneId===loadId)return;
  if(mapLoadNeedsAsking()){try{updateMapInfo()}catch(e){}return}
  bgLoadAllPages(f,loadId);
}
async function bgLoadAllPages(f,loadId){
  /* Prevent concurrent loads with same loadId */
  if(S._bgRunning===loadId)return;
  S._bgRunning=loadId;
  const total=(S._alaTotal!=null)?S._alaTotal:S.total; /* ALA's part only; the register additions are already in hand */
  if(total<=0){S._bgRunning=null;return}
  const cap=S.mapUncapped?Infinity:MAP_POINT_CAP;
  const API='https://biocache-ws.ala.org.au/ws/occurrences/search?';
  const seen=new Set();
  const allGeo=[];
  let lastRedraw=0;
  S.mapFetched=0;
  if(S.view==='map')updateMapInfo();

  const cancelled=()=>S.mapLoadId!==loadId;
  const capReached=()=>!S.mapUncapped&&allGeo.length>=cap;
  const addGeo=r=>{
    if(r.lat==null||r.lng==null)return;
    const k=r.uuid||(r.lat+','+r.lng+'|'+(r.catalog||r.sci||''));
    if(seen.has(k))return;
    seen.add(k);allGeo.push(r);
  };
  const redraw=force=>{
    if(cancelled())return;
    S.allPts=allGeo;S.mapFetched=allGeo.length;
    if(S.view==='map'){
      try{updateMapInfo()}catch(e){}
      if(force||allGeo.length-lastRedraw>=2000){try{addMarkers()}catch(e){}lastRedraw=allGeo.length}
    }
  };

  const CONCURRENCY=4; /* parallel page fetches — gentle on ALA, ~4x faster than serial */
  /* One ALA GET with retry on transient failures (5xx / 429 / network). Returns
     parsed JSON, or null if non-retryable or retries exhausted. */
  async function fetchJSON(qs){
    for(let attempt=0;attempt<5;attempt++){
      if(cancelled())return null;
      try{
        const r=await fetch(API+qs);
        if(cancelled())return null;
        if(r.ok)return await r.json();
        if(r.status>=500||r.status===429){await new Promise(z=>setTimeout(z,400*(attempt+1)));continue}
        return null; /* other 4xx — not retryable */
      }catch(e){await new Promise(z=>setTimeout(z,400*(attempt+1)))}
    }
    return null;
  }
  /* Count records matching f within an optional bbox. Returns count, or -1 on failure. */
  async function countTile(bbox){
    const ff=bbox?Object.assign({},f,{bbox}):f;
    const u=new URLSearchParams();
    u.set('q',f.q||'*:*');appendFQ(u,alaBaseFQ(ff));
    u.set('pageSize','0');u.set('facets','');u.set('flimit','0');
    const d=await fetchJSON(''+u);
    return d?(d.totalRecords||0):-1;
  }
  /* Fetch all records (up to the 5000 window) matching f within an optional bbox,
     paging with bounded concurrency. count = the tile's known total. */
  async function pageTile(bbox,count){
    const ff=bbox?Object.assign({},f,{bbox}):f;
    const fqArr=alaBaseFQ(ff);
    const n=Math.min(count,ALA_MAX_RESULTS);
    const offsets=[];for(let off=0;off<n;off+=ALA_MAX_PAGE)offsets.push(off);
    let idx=0;
    const worker=async()=>{
      while(idx<offsets.length){
        if(cancelled()||capReached())return;
        const off=offsets[idx++];
        const sz=Math.min(ALA_MAX_PAGE,n-off);
        const u=new URLSearchParams();
        u.set('q',f.q||'*:*');appendFQ(u,fqArr);
        u.set('pageSize',sz);u.set('startIndex',off);u.set('sort','id');u.set('dir','asc');u.set('facets','');u.set('flimit','0');
        const d=await fetchJSON(''+u);
        if(cancelled())return;
        if(d&&d.occurrences)d.occurrences.map(normRec_A).filter(_notHeldHit).forEach(addGeo);
        redraw(false);
      }
    };
    await Promise.all(Array.from({length:Math.min(CONCURRENCY,offsets.length||1)},worker));
  }

  try{
    if(total<=ALA_MAX_RESULTS){
      /* Whole query fits in one window — no partitioning needed. */
      await pageTile(null,total);
    }else{
      /* Seed with the first window for instant feedback (deduped against the tree). */
      await pageTile(null,ALA_MAX_RESULTS);
      /* Quadtree: breadth-first over geographic tiles. Root at the active map
         box if there is one, else the whole globe (empty ocean tiles prune fast). */
      const MIN_SPAN=0.0005; /* ~50 m — floor to avoid infinite splitting on a single dense locality */
      const root=f.bbox?{s:f.bbox.s,n:f.bbox.n,w:f.bbox.w,e:f.bbox.e}:{s:-90,n:90,w:-180,e:180};
      const queue=[root];
      let hardFails=0;
      while(queue.length){
        if(cancelled()||capReached())break;
        const b=queue.shift();
        const c=await countTile(b);
        if(cancelled())return;
        if(c<0){ /* transient failure after retries — requeue a few times, then skip */
          b._fails=(b._fails||0)+1;
          if(b._fails<=3)queue.push(b);
          else{hardFails++;console.warn('[bgLoad] giving up on tile',b)}
          if(hardFails>20){console.error('[bgLoad] too many tile failures, stopping');break}
          continue;
        }
        if(c===0)continue;
        const span=Math.max(b.n-b.s,b.e-b.w);
        if(c<=ALA_MAX_RESULTS||span<=MIN_SPAN){
          await pageTile(b,c);
        }else{
          const ml=(b.s+b.n)/2,mg=(b.w+b.e)/2;
          queue.push({s:b.s,n:ml,w:b.w,e:mg},{s:b.s,n:ml,w:mg,e:b.e},
                     {s:ml,n:b.n,w:b.w,e:mg},{s:ml,n:b.n,w:mg,e:b.e});
        }
      }
    }
  }catch(e){console.error('[bgLoad]',e)}

  if(!cancelled()){
    S.allPts=allGeo;S.mapFetched=allGeo.length;
    S._bgRunning=null;S._mapDoneId=loadId;
    if(S.view==='map'){try{addMarkers();updateMapInfo()}catch(e){}}
  }
}

/* ── Background polygon scan — builds MASTER cache of ALL polygon records (unfiltered) ── */
async function bgPolyScan(masterF,loadId,searchId,cursor,startCount,bboxTotal){
  if(S._bgRunning===loadId)return;
  S._bgRunning=loadId;
  const BATCH=ALA_MAX_PAGE;

  let alaFetched=cursor.alaFetched||0;
  let polyCount=startCount;
  const REC_CAP=S.mapUncapped?Infinity:50000;
  /* Seed with all MASTER records already found by fill-page (unfiltered) */
  const allMasterRecs=(S._polyMasterRecs||[]).slice();
  let failures=0;
  let lastUIUpdate=Date.now();

  const getScanned=()=>alaFetched;

  /* Offset-scan the bbox (stably id-sorted), bounded by ALA's 5000 window. */
  while(getScanned()<bboxTotal && alaFetched<ALA_MAX_RESULTS){
    if(S.mapLoadId!==loadId||S._searchId!==searchId||!S.mapPoly?.rings)return;
    try{
      /* Query ALA with UNFILTERED masterF (only institution + bbox — no taxonomy/collection) */
      const fqs=alaBaseFQ(masterF);
      const sz=Math.min(BATCH,ALA_MAX_RESULTS-alaFetched);
      const u=new URLSearchParams();u.set('q','*:*');appendFQ(u,fqs);
      u.set('pageSize',sz);u.set('startIndex',alaFetched);
      u.set('sort','id');u.set('dir','asc');
      u.set('facets','');u.set('flimit','0');
      const r=await fetch('https://biocache-ws.ala.org.au/ws/occurrences/search?'+u);
      if(S.mapLoadId!==loadId||S._searchId!==searchId)return;
      if(!r.ok)throw new Error('ALA '+r.status);
      const d=await r.json();
      if(S.mapLoadId!==loadId||S._searchId!==searchId)return;
      const rawOccs=d.occurrences||[];
      const recs=rawOccs.map(normRec_A).filter(_notHeldHit);
      alaFetched+=rawOccs.length;
      if(!rawOccs.length)break;
      for(const r of recs){
        if(!S.mapPoly?.rings)break;
        if(r.lat!=null&&r.lng!=null&&pointInPolygon(r.lat,r.lng,S.mapPoly.rings)){
          polyCount++;
          if(allMasterRecs.length<REC_CAP)allMasterRecs.push(r);
        }
      }
      /* Update UI periodically — apply user filters to show accurate filtered counts */
      const now=Date.now();
      if(now-lastUIUpdate>500){
        if(S.mapLoadId!==loadId||S._searchId!==searchId)return;
        lastUIUpdate=now;
        /* Update master cache in progress */
        S._polyMasterRecs=allMasterRecs;
        /* Apply current user filters for display */
        const userF=getFilters();
        const filtered=clientFilterRecs(allMasterRecs,userF);
        S.total=filtered.length;
        S._polyAllRecs=filtered;
        S.allPts=filtered.filter(r=>r.lat!=null&&r.lng!=null);
        const pct=Math.round(getScanned()/bboxTotal*100);
        try{$('#sRec').textContent=fmt(S.total)+' ⏳ '+pct+'%'}catch(e){}
        try{$('#rc').innerHTML=`<b>${fmt(S.total)}</b> ${recWord(S.total)} in area <span style="color:#a86a00">(scanning… ${pct}%)</span>`}catch(e){}
        if(S.view==='map'){try{updateMapInfo();addMarkers()}catch(e){}}
      }
    }catch(e){
      failures++;console.warn('[bgPolyScan]',e);
      if(failures>5){console.error('[bgPolyScan] Too many failures, stopping with partial count');break}
      await new Promise(r=>setTimeout(r,500));
    }
  }
  /* Scan complete — finalize master cache and recompute everything */
  if(S.mapLoadId===loadId&&S._searchId===searchId){
    S._polyMasterRecs=allMasterRecs;
    S._polyMasterDone=true;
    S._polyMasterBboxTotal=bboxTotal;
    S._bgRunning=null;
    S._polyScanDone=true;

    /* Apply current user filters to get the displayed set */
    const userF=getFilters();
    const filtered=clientFilterRecs(allMasterRecs,userF);
    S.total=filtered.length;
    S._polyAllRecs=filtered;
    S.res=filtered.slice(0,INIT_PAGE);
    S.allPts=filtered.filter(r=>r.lat!=null&&r.lng!=null);

    /* Compute analytics from FILTERED set */
    S.qc=computeLocalQC(filtered);
    S.richness=computeLocalRichness(filtered);
    S._qcStale=false;

    /* Compute dropdown facets from MASTER set using relax-self approach */
    const dropdownFacets=computePolyDropdownFacets(allMasterRecs,userF);
    Object.entries(dropdownFacets).forEach(([k,v])=>{S.facets[k]=v});
    const localAF=computeLocalAnalyticsFacets(filtered);
    Object.entries(localAF).forEach(([k,v])=>{S.facets[k]=v});

    try{updateStats()}catch(e){}
    try{updateDropdowns()}catch(e){}
    S.treeCache.clear();
    if(S.view==='taxa'){try{renderTaxa()}catch(e){}}
    if(S.view==='guide'){try{renderGuide()}catch(e){}}
    if(S.view==='charts'){try{renderCharts()}catch(e){}}

    const partial=failures>5;
    try{$('#sRec').textContent=fmt(S.total)+(partial?' ⚠':'')}catch(e){}
    try{$('#rc').innerHTML=`<b>${fmt(S.total)}</b> ${recWord(S.total)} in area${partial?' <span style="color:#c44" title="Scan incomplete due to network errors">⚠ partial</span>':''}`}catch(e){}
    try{updatePag()}catch(e){}
    try{renderView()}catch(e){}
    if(S.view==='map'){try{addMarkers();updateMapInfo()}catch(e){}}
  }
}

/* Facet-only query for tree drill-down.
   In polygon mode, uses local polygon-filtered records for accurate counts. */
async function fetchChildFacets(ancestors,targetRank){
  const ck=JSON.stringify(ancestors)+'→'+targetRank;
  if(S.treeCache.has(ck))return S.treeCache.get(ck);

  /* Polygon mode: use local records */
  const polyRecs=S.mapPoly?.rings ? (S._polyAllRecs||S.res) : null;
  if(polyRecs&&polyRecs.length){
    const counts=new Map();
    for(const r of polyRecs){
      let match=true;
      for(const [ak,av] of Object.entries(ancestors)){
        const rk=ak==='class'?'class_':ak;
        if((r[rk]||'')!==av){match=false;break}
      }
      if(!match)continue;
      const v=r[targetRank==='class'?'class_':targetRank];
      if(v)counts.set(v,(counts.get(v)||0)+1);
    }
    const items=[...counts.entries()].map(([name,count])=>({name,value:name,count})).sort((a,b)=>b.count-a.count);
    S.treeCache.set(ck,items);return items;
  }

  /* Standard mode: query ALA API */
  const mapped={};Object.entries(ancestors).forEach(([k,v])=>{mapped[k==='class'?'class_':k]=v});
  const f={...getFilters(),...mapped};
  /* Some ranks (e.g. superfamily) aren't indexed by all APIs — try API first, fall back to client grouping */
  try{
    let items=[];
    const d=await alaFetch(f,0,1);
    const fac=extractFacets_A(d);
    items=(fac[targetRank]||[]).sort((a,b)=>b.count-a.count);
    /* If API returned nothing, try client-side grouping from loaded records */
    if(!items.length&&S.res.length){
      const counts=new Map();
      S.res.forEach(r=>{
        /* Check ancestors match */
        let match=true;
        for(const [ak,av] of Object.entries(ancestors)){
          const rk=ak==='class'?'class_':ak;
          if(r[rk]&&r[rk]!==av){match=false;break}
        }
        if(!match)return;
        const v=r[targetRank==='class'?'class_':targetRank];
        if(v)counts.set(v,(counts.get(v)||0)+1);
      });
      items=[...counts.entries()].map(([name,count])=>({name,value:name,count})).sort((a,b)=>b.count-a.count);
    }
    S.treeCache.set(ck,items);return items;
  }catch(e){
    console.warn('[fetchChildFacets] '+targetRank+' failed:',e.message);
    /* Last resort: client-side grouping */
    const counts=new Map();
    S.res.forEach(r=>{
      const v=r[targetRank==='class'?'class_':targetRank];
      if(v)counts.set(v,(counts.get(v)||0)+1);
    });
    const items=[...counts.entries()].map(([name,count])=>({name,value:name,count})).sort((a,b)=>b.count-a.count);
    S.treeCache.set(ck,items);return items;
  }
}

function updateStats(){

function updateDropdowns(){
  const sortMode=$('#fSort')?.value||'count';
  const taxSort=(a,b)=>{
    if(sortMode==='az')return(a.name||'').localeCompare(b.name||'');
    if(sortMode==='za')return(b.name||'').localeCompare(a.name||'');
    return b.count-a.count;
  };
  const fm={fK:S.facets.kingdom||[],fP:S.facets.phylum||[],fC:S.facets['class']||[],fO:S.facets.order||[],fF:S.facets.family||[],fG:S.facets.genus||[],fSp:S.facets.species||[]};
  Object.entries(fm).forEach(([id,items])=>{
    const sel=$('#'+id);if(!sel)return;
    const cv=sel.value;const lab=sel.options[0]?.textContent||'All';
    sel.innerHTML=`<option value="">${lab}</option>`;
    items.sort(taxSort).forEach(i=>{
      const o=document.createElement('option');
      o.value=i.value||i.name;
      o.textContent=`${i.name} (${fmt(i.count)})`;
      sel.appendChild(o);
    });
    if(cv){for(const o of sel.options)if(o.value===cv){sel.value=cv;break}}
  });
  /* Auto-select parent filters when a child filter narrows them to a single value.
     E.g. selecting Order=Diptera makes Kingdom=Animalia, Phylum=Arthropoda, Class=Insecta
     the only options — auto-select them for visual context. */
  let childSet=false;
  for(let i=FIDS.length-1;i>=0;i--){
    const sel=$('#'+FIDS[i]);
    if(sel?.value){childSet=true;continue}
    if(childSet&&sel&&!sel.value){
      const items=fm[FIDS[i]]||[];
      if(items.length===1){sel.value=items[0].value||items[0].name}
    }
  }
  // State dropdown
  const stF=S.facets.state||S.facets.stateprovince||[];
  if(stF.length || S.mapPoly){
    const sel=$('#fSt');const cv=sel.value;
    sel.innerHTML='<option value="">All States</option>';
    stF.sort((a,b)=>b.count-a.count).forEach(i=>{
      const o=document.createElement('option');
      o.value=i.value||i.name;
      o.textContent=`${i.name} (${fmt(i.count)})`;
      sel.appendChild(o);
    });
    if(cv){for(const o of sel.options)if(o.value===cv){sel.value=cv;break}}
  }
  // Collection dropdown (ALA collection_uid facet — value is UID like "co50", name is display label)
  const collF=S.facets.collection_uid||S.facets.collectionCode||[];
  {
    const sel=$('#fColl');const cv=sel.value;
    /* Always rebuild in polygon mode to avoid stale QM-wide counts */
    if(collF.length || S.mapPoly){
      sel.innerHTML='<option value="">All Collections</option>';
      collF.sort((a,b)=>b.count-a.count).forEach(i=>{
        const o=document.createElement('option');
        o.value=i.value||i.name;  // e.g. "co50" or "Entomology"
        o.textContent=`${shortColl(i.name)} (${fmt(i.count)})`;
        sel.appendChild(o);
      });
      if(cv){for(const o of sel.options)if(o.value===cv){sel.value=cv;break}}
    }
  }
}
function updatePag(){
  const el=$('#pag');if(!el)return;
  const hasPoly=!!(S.mapPoly&&S.mapPoly.rings);
  if(hasPoly){
    const pg=(S._polyPage||0)+1;
    const t=S.total;
    const tp=Math.max(1,Math.ceil(t/INIT_PAGE));
    const atEnd=S.res.length<INIT_PAGE; /* couldn't fill page = last page */
    const scanning=!S._polyScanDone;
    el.style.display=(t>INIT_PAGE||scanning)?'flex':'none';
    $('#prevP').disabled=pg<=1;$('#nextP').disabled=atEnd;
    let info=`Page ${pg}${scanning?'':' of '+ fmt(tp)} · ${fmt(t)}${scanning?' ⏳':''} ${recWord(t)} · ${S.res.length} shown`;
    const pn=$('#pgNote');if(pn)pn.hidden=true;
    info+=` · ${S.mapPoly.name}`;
    $('#pgI').textContent=info;
    $('#rc').innerHTML=t>0?`<b>${fmt(t)}</b> ${recWord(t)} in area${scanning?' <span style="color:#a86a00">⏳</span>':''}`:'';
  }else{
    /* ALA won't serve records past index ALA_MAX_RESULTS, so cap the reachable pages there. */
    const t=S.total,sN=S._suppN||0,alaT=(S._alaTotal!=null)?S._alaTotal:t-sN;
    const reachable=Math.min(alaT,ALA_MAX_RESULTS)+sN,pg=Math.floor(S.off/INIT_PAGE)+1,tp=Math.max(1,Math.ceil(reachable/INIT_PAGE));
    el.style.display=t>INIT_PAGE?'flex':'none';
    const capped=alaT>ALA_MAX_RESULTS;
    $('#prevP').disabled=pg<=1;$('#nextP').disabled=pg>=tp;
    $('#pgI').textContent=`Page ${pg} of ${fmt(tp)} · ${capped?`first ${fmt(reachable)} of ${fmt(t)}`:fmt(t)} ${recWord(t)} · ${S.res.length} shown`;
    $('#rc').innerHTML=t>0?`<b>${fmt(t)}</b> ${recWord(t)}`+((S._suppSrc==='')&&sN?` <span class="rc-split">(${fmt(alaT)} ALA Biocache · ${fmt(sN)} QM Register)</span>`:''):'';
    const pn=$('#pgNote');
    if(pn){
      pn.hidden=!capped;
      pn.textContent=capped?'Narrow the search (by collection, family or type status) to see more than 5,000 records.':'';
    }
  }
}

function galMostPics(){const n=S.res.length;if(!n)return false;let k=0;for(const r of S.res)if(r.media?.length)k++;return k/n>0.5}
/* All records and imaged records for the current search with "With images" set aside,
   counting ALA and the register additions (imaged in the register counts as imaged). */
const _imgSplitCache=new Map();
async function fetchImagedSplit(f){
  const g={...f,media:''};
  if(S.mapPoly&&S._polyAllRecs){const a=clientFilterRecs(S._polyMasterRecs||S._polyAllRecs,g);return{all:a.length,imaged:a.filter(r=>(r.media&&r.media.length)||r._imagedReg).length}}
  const key=JSON.stringify(g);
  if(_imgSplitCache.has(key))return _imgSplitCache.get(key);
  const p=(async()=>{
    let all=0,imaged=0;const src=g.source||'';
    if(src!=='reg'){
      const fq=alaBaseFQ(g);const q=g.q||'*:*';
      const url=extra=>{const u=new URLSearchParams();u.set('q',q);appendFQ(u,fq);if(extra)appendFQ(u,extra);u.set('pageSize','0');u.set('facets','');return 'https://biocache-ws.ala.org.au/ws/occurrences/search?'+u};
      const [a,m]=await Promise.all([fetch(url()).then(r=>r.ok?r.json():null),fetch(url(['multimedia:"Image"'])).then(r=>r.ok?r.json():null)]);
      if(!a||!m)throw new Error('count failed');
      all+=a.totalRecords||0;imaged+=m.totalRecords||0;
    }
    if(src!=='ala'){const sp=suppFilter(await loadSupplement(),g);all+=sp.length;imaged+=sp.filter(r=>r._imagedReg).length}
    return{all,imaged};
  })();
  _imgSplitCache.set(key,p);p.catch(()=>_imgSplitCache.delete(key));
  return p;
}
let _galLinkTok=0;

  const el=$('#galCount');if(!el)return;

    if(density==='grid'){
      el.innerHTML=`<button type="button" class="gal-link" data-go="list">All ${fmt(all)} ${recWord(all)} in the List →</button>`;
    }else if(imaged>0){

    }else{

}

function renderGallery(){
  const g=$('#gal');if(!S.res.length)return;
  /* Density toggle bar */
  const bar=$('#galBar');bar.classList.add('vis');
  /* List is the default. The Gallery is for pictures: it opens by itself when
     "With images" is on or most records on the page have a picture, and otherwise
     only when asked for (which turns "With images" on). */
  const mediaFilter=!!$('#fMedia')?.value;

  let density=(S._densityManual&&S.galDensity)?S.galDensity:autoDensity;

       seeded by the scientific name, labelled with the family — honest "no photo" state,
       never a collapsed stub or a broken dash. */
    const phUrl=imgPlaceholderCandidate(r.sci||r.family||r.genus||r.order||'?','species',r.family||r.order||'').url;
    const th=hasImg
      ? `<img src="${esc(r.media[0])}" alt="" loading="lazy" onerror="this.onerror=null;this.src='${phUrl}'"/>`

    const sciLo=(r.sci||'').toLowerCase().trim();

    return`<div class="card${hasImg?'':' no-media'}" data-i="${i}" style="--cc:${collC}">
      <div class="card-kb" style="background:${collC}"></div>
      <div class="card-coll"><span>${esc(collName)}</span></div>
      <div class="card-th">${hasImg?th:plate}${hasType?`<span class="card-type" style="background:${tc}">${esc(r.typeStatus)}</span>`:''}</div>
      <div class="card-body">
        <div class="card-sci${shouldItalic(r.sci)?' it':''}">${esc(sciDisplay)}</div>
        <div class="card-names">${cardNamesHTML(r)}</div>
        <div class="card-cat-line">${r.cat?`<span class="card-cat">${esc(r.cat)}</span>`:''} ${hasType?`<span class="card-type-inline" style="background:${tc}">${esc(r.typeStatus)}</span>`:''}</div>
        ${vernShow?`<div class="card-com">${esc(vernShow)}</div>`:''}
        ${r.family?`<div class="card-fam">${esc(r.family)}</div>`:''}
        ${r._supp?`<div class="card-src">Added from Queensland Museum’s register${r._suppReview?'<span class="card-review">Curator review pending</span>':''}</div>`:''}
        <div class="card-det">
          ${taxCrumb?`<div class="card-tax">${taxCrumb}</div>`:''}

  }).join('');
  /* Event delegation: single listener on gallery container instead of per-card */
  if(!g._delegated){

      const link=e.target.closest('.tax-link');
      if(link){e.preventDefault();e.stopPropagation();applyTaxonFilter(link.dataset.rk,link.dataset.nm);return}
      const card=e.target.closest('.card');
      if(card&&card.dataset.i!=null)openModal(+card.dataset.i);
    });
  }
  /* Batch-fetch vernacular names for visible cards — deferred to let gallery paint first */
  const _ric=window.requestIdleCallback||((cb)=>setTimeout(cb,80));

/* TAXA TREE — lazy-load from API facets, auto-expand to active filters */
function renderTaxa(){
  const root=$('#taxaRoot');root.innerHTML='';
  /* Detect active filter path for auto-expansion */
  const filterPath=[];
  const _filterRanks=[['kingdom','fK'],['phylum','fP'],['class','fC'],['order','fO'],['family','fF'],['genus','fG'],['species','fSp']];
  for(const [rk,fid] of _filterRanks){
    const v=$('#'+fid)?.value;
    if(v)filterPath.push({rank:rk,name:v});
    else break; /* stop at first gap — path must be contiguous */
  }
  const hasPath=filterPath.length>0;
  
  const ctl=document.createElement('div');ctl.className='tree-ctl';
  const scanning=S.mapPoly&&!S._polyScanDone;
  ctl.innerHTML=`<label>Taxonomy tree</label><span class="muted">(${fmt(S.total)} total${scanning?' — scanning…':''})</span><button id="expAll" class="p">Expand all</button><button id="colAll" class="p">Collapse all</button>`;
  root.appendChild(ctl);
  
  ctl.querySelector('#colAll')?.addEventListener('click',()=>{
    root.querySelectorAll('.tn-kids').forEach(k=>{
      k.classList.add('shut');
      const t=k.previousElementSibling?.querySelector('.tn-tog');if(t)t.textContent='▸';
    });
  });
  ctl.querySelector('#expAll')?.addEventListener('click',()=>{
    root.querySelectorAll('.tn-kids').forEach(k=>{
      k.classList.remove('shut');
      const t=k.previousElementSibling?.querySelector('.tn-tog');if(t&&t.textContent)t.textContent='▾';
    });
    autoExpandAll(root,0);
  });
  
  const wrap=document.createElement('div');root.appendChild(wrap);
  let kingdoms=S.facets.kingdom||[];
  const polyRecs=S.mapPoly?.rings ? (S._polyAllRecs||S.res) : null;
  if(polyRecs&&polyRecs.length){
    const kMap=new Map();
    for(const r of polyRecs){if(r.kingdom)kMap.set(r.kingdom,(kMap.get(r.kingdom)||0)+1)}
    kingdoms=[...kMap.entries()].map(([name,count])=>({name,value:name,count}));
  }
  if(!kingdoms.length){wrap.innerHTML='<div class="empty"><div class="ico">🌿</div><h3>No taxonomy</h3><p>Run a search first.</p></div>';return}
  kingdoms.sort((a,b)=>b.count-a.count).forEach(k=>{
    /* Should this kingdom node auto-expand? Yes if it's on the filter path, or if there's only 1 kingdom */
    const shouldExpand=hasPath?(filterPath[0]?.rank==='kingdom'&&filterPath[0]?.name===k.name):kingdoms.length===1;
    wrap.appendChild(mkTreeNode(k.name,k.count,'kingdom',{},shouldExpand?filterPath:null));
  });

/* Recursively expand all loaded nodes, and trigger loading on unloaded ones up to maxDepth */
async function autoExpandAll(container,depth){
  if(depth>4)return; /* safety limit — don't drill infinitely */
  const nodes=container.querySelectorAll(':scope > .tn');
  for(const node of nodes){
    const kids=node.querySelector(':scope > .tn-kids');
    const hdr=node.querySelector(':scope > .tn-h');
    if(!kids||!hdr)continue;
    const tog=hdr.querySelector('.tn-tog');
    if(!tog||!tog.textContent.trim())continue; /* leaf node */
    /* If not yet loaded, simulate click to load */
    if(!kids.children.length||kids.querySelector('.tn-loading')){
      hdr.click();
      /* Wait for children to load */
      await new Promise(r=>{
        const check=()=>{
          if(!kids.querySelector('.tn-loading')){r();return}
          setTimeout(check,100);
        };
        setTimeout(check,50);
      });
    }
    /* Ensure it's open */
    kids.classList.remove('shut');
    if(tog)tog.textContent='▾';
    /* Recurse into children */
    await autoExpandAll(kids,depth+1);
  }
}

/* Throttle for tree vernacular lookups: expanding a node can create dozens of
   genus/species children at once — cap concurrent GBIF/iNat calls so we don't
   hammer those APIs (cachedFetch still dedupes identical requests). */
const _treeVernQ=[]; let _treeVernActive=0; const _TREE_VERN_CONC=4;
function _queueTreeVern(task){
  return new Promise(resolve=>{
    _treeVernQ.push(async()=>{ try{resolve(await task())}catch(e){resolve(null)} });
    _drainTreeVern();
  });
}
function _drainTreeVern(){
  while(_treeVernActive<_TREE_VERN_CONC && _treeVernQ.length){
    const job=_treeVernQ.shift(); _treeVernActive++;
    job().finally(()=>{ _treeVernActive--; _drainTreeVern(); });
  }
}

/* Lazy resolution: only nodes scrolled into view trigger an API lookup, so
   expanding a node with hundreds of children doesn't fire hundreds of GBIF/iNat
   calls (which overloads those services). Curated names still resolve instantly. */
const _treeVernObserver = ('IntersectionObserver' in window) ? new IntersectionObserver(entries=>{
  for(const e of entries){
    if(e.isIntersecting){
      _treeVernObserver.unobserve(e.target);
      const fn=e.target._vernResolve; e.target._vernResolve=null;
      if(fn)fn();
    }
  }
},{rootMargin:'150px'}) : null;

/* Resolve and display a common name for a taxa tree node.
   - Class/order and curated families resolve instantly from _localVern (no network).
   - Uncurated families, genera and species are fetched via the shared resolver
     (lookupVern → GBIF + iNaturalist), cached in _vernCache — but ONLY once the node
     is visible (lazy), and throttled.
   - A genus with no name of its own falls back to its family's curated name. */
function _fillTreeVern(el,name,rank,ancestors){
  if(!el)return;
  const lo=name.toLowerCase();
  const ck=cleanTaxonTerm(name);
  const show=n=>{ if(el&&n&&!isGenericVern(n)) el.textContent=singularize(n); };
  const genusFamilyFallback=()=>{
    if(rank!=='genus')return;
    const fam=(ancestors?.family||'').toLowerCase();
    const fv=fam&&_localVern[fam];
    if(fv&&!isGenericVern(fv)) el.textContent=singularize(fv);
  };

  /* 1. Curated dictionary — instant and trusted (all classes/orders, common families) */
  const dict=_localVern[lo];
  /* Curated dictionary names are rank-appropriate by construction (e.g.
     Formicidae→"ant", Noctuidae→"owlet moth"), so trust them directly — do NOT
     gate on isGenericVern here. Family-level _localVern values are deliberately
     injected into _genericVernSet by the auto-populate IIFE so that GENUS lookups
     climb to subfamily/tribe; running that same gate over a FAMILY node's own
     curated name would wrongly blank the tile. Still singularize for display. */
  if(dict){ el.textContent=singularize(dict); return; }

  /* 2. Already cached (from a prior lookup anywhere) — instant, no network */
  if(_vernCache.has(ck)){
    const cached=_vernCache.get(ck);
    if(cached) show(cached); else genusFamilyFallback();
    return;
  }

  /* 3. Needs a network lookup — defer until the node is visible, then throttle. */
  const resolve=async()=>{
    if(_vernCache.has(ck)){ const c=_vernCache.get(ck); if(c){show(c);return} }
    const result=await _queueTreeVern(()=>lookupVern(name));
    const nm=result&&result.name;
    _vernCache.set(ck, nm||null);
    if(nm) show(nm); else genusFamilyFallback();
  };
  const target=el.closest('.tn-h')||el;
  if(_treeVernObserver){
    target._vernResolve=resolve;
    /* Observe only once the node is actually in the DOM — IntersectionObserver
       won't fire for elements observed while still detached (mkTreeNode builds
       them before appending). The caller attaches synchronously, so by the next
       frame the node is connected. */
    requestAnimationFrame(()=>{ if(target._vernResolve&&target.isConnected) _treeVernObserver.observe(target); });
  }
  else resolve(); /* no IntersectionObserver support — resolve eagerly */
}

function mkTreeNode(name,count,rank,ancestors,autoExpandPath){
  const div=document.createElement('div');div.className='tn'+(rank==='kingdom'?' root':'');
  const ri=RANKS.indexOf(rank);const isIt=ri>=6;const canDrill=ri<RANKS.length-1;
  const h=document.createElement('div');h.className='tn-h';
  h.innerHTML=`<span class="tn-tog">${canDrill?'▸':''}</span><span class="tn-nm${isIt?' it':''}">${esc(name)}</span><span class="tn-ct">${fmt(count)}</span><span class="tn-rk">${RLABEL[rank]||rank}</span><span class="tn-com"></span><div class="tn-btns"><button class="tn-b" data-a="filter">Filter</button><button class="tn-b g" data-a="guide">Browse</button></div>`;
  div.appendChild(h);
  /* Populate common name */
  const comEl=h.querySelector('.tn-com');
  _fillTreeVern(comEl,name,rank,ancestors);
  const kids=document.createElement('div');kids.className='tn-kids shut';let loaded=false;div.appendChild(kids);
  
  /* Load children into this node — shared by click and auto-expand */
  async function loadChildren(){
    if(loaded)return true;
    kids.innerHTML='<div class="tn-loading"><div class="mini-sp"></div>Loading…</div>';
    kids.classList.remove('shut');
    h.querySelector('.tn-tog').textContent='▾';
    try{
      const cf={...ancestors,[rank]:name};
      let items=[];let usedRank=null;
      for(let ti=ri+1;ti<RANKS.length;ti++){
        const tryRank=RANKS[ti];
        items=await fetchChildFacets(cf,tryRank);
        if(items.length){usedRank=tryRank;break}
      }
      kids.innerHTML='';
      if(!items.length||!usedRank){
        kids.innerHTML='<div style="font-size:12px;color:var(--muted);padding:4px 28px">No breakdown</div>';
      }else{
        /* Determine which child (if any) should auto-expand based on the filter path */
        let childAutoPath=null;
        if(autoExpandPath&&autoExpandPath.length>0){
          /* Find the next filter path entry that matches a child at usedRank */
          const nextStep=autoExpandPath.find(fp=>fp.rank===usedRank);
          if(nextStep){
            /* Pass remaining path entries beyond this rank */
            const nextIdx=autoExpandPath.indexOf(nextStep);
            childAutoPath=autoExpandPath.slice(nextIdx+1);
          }
        }
        items.forEach(it=>{
          const shouldAutoExpand=autoExpandPath&&autoExpandPath.some(fp=>fp.rank===usedRank&&fp.name===it.name);
          kids.appendChild(mkTreeNode(it.name,it.count,usedRank,cf,shouldAutoExpand?childAutoPath:null));
        });
      }
      loaded=true;
      return true;
    }catch(err){
      kids.innerHTML='<div style="font-size:12px;color:var(--red);padding:4px 28px">Error: '+esc(err.message)+'</div>';
      return false;
    }
  }
  
  h.addEventListener('click',async e=>{
    if(e.target.closest('.tn-btns'))return;if(!canDrill)return;
    if(!loaded){
      await loadChildren();
    }else{
      kids.classList.toggle('shut');
      h.querySelector('.tn-tog').textContent=kids.classList.contains('shut')?'▸':'▾';
    }
  });
  h.querySelector('[data-a="filter"]')?.addEventListener('click',()=>applyTaxonFilter(rank,name));
  h.querySelector('[data-a="guide"]')?.addEventListener('click',()=>{S.guideFocus={rank:RLABEL[rank],name};switchView('guide')});
  
  /* Auto-expand this node if it's on the filter path */
  if(autoExpandPath&&canDrill){
    /* Use microtask to allow DOM insertion first */
    Promise.resolve().then(()=>loadChildren());
  }
  
  return div;
}
